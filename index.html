<style>
@font-face{font-family:"Bricolage Grotesque";src:url(fonts/bricolage-grotesque-var.woff2) format("woff2");font-weight:200 800;font-display:swap}
@font-face{font-family:"IBM Plex Sans";src:url(fonts/plex-sans-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"IBM Plex Sans";src:url(fonts/plex-sans-500.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"IBM Plex Sans";src:url(fonts/plex-sans-600.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"IBM Plex Mono";src:url(fonts/plex-mono-500.woff2) format("woff2");font-weight:500;font-display:swap}

/* One dark look: black ground, red accent, Mark Six ball colours. Phone-width column, bottom tab bar. */
:root{
  --bg:#0b0b0c; --bar:#111113; --card:#17171a; --card2:#0f0f11; --line:#2a2a2e; --line2:#232327; --line3:#3a3a3f;
  --ink:#f5f2f2; --muted:#a8a1a3; --red:#e3222f; --red-deep:#b80f1b; --red-ink:#ff5a63; --red-soft:#ffd6d8;
  --warn-bg:#2a1214; --warn-line:#4a1a1e; --good:#4fd38c; --good-bg:#1f5e3d; --mid-bg:#5c4712; --bad-bg:#6e1a20;
  --b-red:#cf3239; --b-blue:#2b62c6; --b-green:#1d9452;
  --f-display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
a{color:var(--red-ink)}
:focus-visible{outline:2px solid var(--red-ink);outline-offset:2px}
.app{position:relative;max-width:480px;margin:0 auto;min-height:100dvh;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));overflow:hidden}
.deco{position:absolute;inset:0;pointer-events:none;z-index:0}
.top{position:sticky;top:0;z-index:5;background:var(--bar);border-bottom:1px solid var(--line);padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px}
.top .titles{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
h1,h2{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:22px;font-weight:800;letter-spacing:-.01em}
h2{font-size:16px;font-weight:600}
.sub{font-size:13px;color:var(--muted);margin:0}
main{position:relative;z-index:1;padding:16px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.card{background:rgba(23,23,26,.94);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.flush{padding:4px 16px}
.hero{position:relative;overflow:hidden;background:var(--red-deep);color:#fff;border-radius:20px;padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.hero>*{position:relative}
.hero .ring{position:absolute;right:-40px;top:-50px;opacity:.18;pointer-events:none}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.hero .eyebrow,.hero .soft{color:var(--red-soft)}
.big{font-family:var(--f-display);font-weight:800;font-size:38px;line-height:1}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.list>.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line2)}
.list>.item:last-child{border-bottom:0}
.item .t{display:flex;flex-direction:column;min-width:0}
.item .s{font-size:12.5px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tile{background:var(--card);padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.tile .v{font-family:var(--f-mono);font-weight:600;font-size:clamp(14px,4.4vw,19px);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .s{font-size:12px;color:var(--muted)}
.ball{width:40px;height:40px;flex:none;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-weight:600;font-size:15px;color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25);background:var(--b-green)}
.ball.r{background:var(--b-red)}.ball.b{background:var(--b-blue)}.ball.g{background:var(--b-green)}
.ball.md{width:34px;height:34px;font-size:13px}.ball.sm{width:31px;height:31px;font-size:12.5px}
.ball.ringed{border:2px solid #fff}
.ball.hit{box-shadow:0 0 0 2px var(--bg),0 0 0 4px #fff}
.ball.miss{background:transparent;color:#8d8789;border:1.5px solid var(--line3);box-shadow:none}
.balls{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.btn{height:48px;border-radius:14px;border:1px solid var(--line3);background:transparent;color:var(--ink);font-weight:500;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.btn.outline{border-color:var(--red);color:var(--red-ink);font-weight:600}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}

.back{width:44px;height:44px;margin-left:-12px;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:#26262a;color:#d9d2d4;white-space:nowrap}
.pill.good{background:var(--good-bg);color:#c9f5dc}.pill.mid{background:var(--mid-bg);color:#ffe7a8}.pill.bad{background:var(--bad-bg);color:#ffd0d3}
.pill.hero-pill{background:rgba(0,0,0,.28);color:#fff;font-weight:500}
a.pill{text-decoration:none;min-width:44px;height:28px;display:inline-flex;align-items:center;justify-content:center}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;background:#1e1e22;border-radius:12px}
.seg button{height:36px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-weight:500;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--red);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line3);background:transparent;cursor:pointer;font-weight:500;font-size:14px}
.chips button[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.stepper{display:flex;align-items:center;gap:4px;border:1px solid var(--line3);border-radius:12px;padding:2px}
.stepper button{width:44px;height:40px;border:0;background:transparent;font-size:20px;font-weight:600;cursor:pointer}
.stepper span{min-width:26px;text-align:center;font-family:var(--f-mono);font-weight:600}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--red);flex:none}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
.field input,.field select,textarea{height:44px;border:1px solid var(--line3);border-radius:10px;padding:0 12px;background:var(--card2);color:var(--ink);font-family:var(--f-mono);font-size:15px;width:100%}
textarea{height:150px;padding:10px;font-size:13px;resize:vertical}
select.game{height:44px;border-radius:22px;border:1px solid var(--line3);background:var(--card);padding:0 12px;font-weight:500;font-size:14px;max-width:132px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.note{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:16px;background:rgba(42,18,20,.95);border:1px solid var(--warn-line);font-size:13.5px;color:#e9dfe0}
.note p{margin:0}
.bars{position:relative;height:120px;display:flex;align-items:flex-end;gap:1px;border-bottom:1px solid var(--line3)}
.bars .band{position:absolute;left:0;right:0;background:#2a1517}
.bars .exp{position:absolute;left:0;right:0;border-top:1.5px dashed var(--ink);z-index:1}
.bars i{position:relative;flex:1 1 0;background:var(--red);border-radius:2px 2px 0 0;min-height:2px}
.bars i.hi{background:#ff8a90}.bars i.lo{background:#6b6b70}
.axis{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.track{position:relative;width:120px;height:24px;flex:none}
.track .line{position:absolute;left:0;right:0;top:11px;height:2px;background:var(--line3)}
.track .ok{position:absolute;left:20px;width:80px;top:4px;height:16px;border-radius:4px;background:#2a1517}
.track .mid{position:absolute;left:59px;top:2px;width:2px;height:20px;background:var(--ink)}
.track .dot{position:absolute;top:6px;width:12px;height:12px;border-radius:50%;border:2px solid var(--card)}
.meter{position:relative;height:12px;display:flex;gap:3px}
.meter span{flex:1}
.meter .mark{position:absolute;top:-4px;width:4px;height:20px;margin-left:-2px;border-radius:2px;background:#fff}
.progress{height:12px;border-radius:6px;background:rgba(0,0,0,.35);overflow:hidden}
.progress>div{height:100%;border-radius:6px;background:#fff}
.split{display:flex;height:14px;border-radius:7px;overflow:hidden;background:rgba(0,0,0,.35)}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;z-index:6;background:var(--bar);border-top:1px solid var(--line);padding:8px max(8px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;font-size:12px;font-weight:500;color:var(--muted);text-decoration:none}
.tabs a span{width:56px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center}
.tabs a[aria-current="page"]{color:var(--red-ink);font-weight:600}
.tabs a[aria-current="page"] span{background:#3d1418}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:7;background:#f5f2f2;color:#111;padding:10px 16px;border-radius:12px;font-weight:500;font-size:14px;max-width:min(440px,calc(100% - 32px));box-shadow:0 6px 24px rgba(0,0,0,.4)}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line2);text-align:left}
th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tablebox{overflow-x:auto}
.foot{font-size:12px;color:var(--muted);text-align:center;padding:0 16px 8px}
.foot a{color:inherit}
@media (prefers-reduced-motion:no-preference){.btn,.chips button,.seg button{transition:background .15s,border-color .15s}}
</style>

<script>
/* ================= constants & state ================= */
const $=s=>document.querySelector(s);
const GAMES={marksix:{name:'Mark Six',k:6,N:49,cur:'HK$'},uk:{name:'UK Lotto',k:6,N:59,cur:'£'},euro:{name:'EuroMillions',k:5,N:50,cur:'€'},pb:{name:'Powerball',k:5,N:69,cur:'$'}};
const STRATS=[{id:'random',name:'Random',chip:'Random',color:'#9a9496'},{id:'hot',name:'Lean hot',chip:'Lean hot',color:'#ff7a55'},{id:'cold',name:'Lean cold',chip:'Lean cold',color:'#6ea2ee'},{id:'overdue',name:'Lean overdue',chip:'Overdue',color:'#e0b04a'},{id:'mix',name:'Hot + cold mix',chip:'Hot + cold',color:'#b98cf0'}];
const HK_RED=[1,2,7,8,12,13,18,19,23,24,29,30,34,35,40,45,46],HK_BLUE=[3,4,9,10,14,15,20,25,26,31,36,37,41,42,47,48];
const KEY='drawlab2';
const S={game:'marksix',k:6,N:49,draws:[],source:'sample',win:100,warm:50,period:100,
  groups:[],cur:'HK$',limit:200,remind:true,log:[],
  gen:{strategy:'random',count:5,avoid:true,sets:[]},scoreRef:null};
function save(){try{const o={...S,draws:S.source==='sample'?[]:S.draws};delete o.scoreRef;localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}}
/* v1 migration: drop the removed syndicate data and ticket pricing, rename tickets to number sets,
   and detach saved sets from any spending or prize figures */
function migrate(o){if(!o||typeof o!=='object')return o;delete o.syn;delete o.price;delete o.pauseOver;
  if(o.gen){if(o.gen.tickets&&!o.gen.sets)o.gen.sets=o.gen.tickets;delete o.gen.tickets}
  if(Array.isArray(o.groups))o.groups=o.groups.map(g=>({id:g.id,game:g.game,after:g.after,created:g.created,sets:g.sets||g.tickets||[]}));
  if(!Array.isArray(o.log))o.log=[];return o}
function load(){try{const o=migrate(JSON.parse(localStorage.getItem(KEY)||'null'));if(o)Object.assign(S,o,{scoreRef:null})}catch(e){}}

/* ================= maths ================= */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function lgamma(z){const c=[0.99999999999980993,676.5203681218851,-1259.1392167224028,771.32342877765313,-176.61502916214059,12.507343278686905,-0.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];if(z<0.5)return Math.log(Math.PI/Math.sin(Math.PI*z))-lgamma(1-z);z-=1;let x=c[0];for(let i=1;i<9;i++)x+=c[i]/(z+i);const t=z+7.5;return 0.5*Math.log(2*Math.PI)+(z+0.5)*Math.log(t)-t+Math.log(x)}
function lC(n,r){return r<0||r>n?-Infinity:lgamma(n+1)-lgamma(r+1)-lgamma(n-r+1)}
function hyper(m,k,N){return Math.exp(lC(k,m)+lC(N-k,k-m)-lC(N,k))}
function gammaP(a,x){if(x<=0)return 0;const lg=lgamma(a);if(x<a+1){let ap=a,s=1/a,d=s;for(let i=0;i<1000;i++){ap++;d*=x/ap;s+=d;if(Math.abs(d)<Math.abs(s)*1e-14)break}return s*Math.exp(-x+a*Math.log(x)-lg)}let b=x+1-a,c=1e300,d=1/b,h=d;for(let i=1;i<1000;i++){const an=-i*(i-a);b+=2;d=an*d+b;if(Math.abs(d)<1e-300)d=1e-300;c=b+an/c;if(Math.abs(c)<1e-300)c=1e-300;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<1e-14)break}return 1-Math.exp(-x+a*Math.log(x)-lg)*h}
function erfc(x){const z=Math.abs(x),t=1/(1+0.5*z);const r=t*Math.exp(-z*z-1.26551223+t*(1.00002368+t*(0.37409196+t*(0.09678418+t*(-0.18628806+t*(0.27886807+t*(-1.13520398+t*(1.48851587+t*(-0.82215223+t*0.17087277)))))))));return x>=0?r:2-r}
const pTwo=z=>erfc(Math.abs(z)/Math.SQRT2);
function sampleK(N,k,r){const a=Array.from({length:N},(_,i)=>i+1);for(let i=0;i<k;i++){const j=i+Math.floor(r()*(N-i));[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,k).sort((x,y)=>x-y)}
function weightedK(w,k,r,ex=new Set()){const out=[],ww=w.slice();ex.forEach(x=>ww[x]=0);for(let j=0;j<k;j++){let tot=0;for(let i=1;i<ww.length;i++)tot+=ww[i];let u=r()*tot,pick=-1;for(let i=1;i<ww.length;i++){if(ww[i]<=0)continue;pick=i;u-=ww[i];if(u<=0)break}out.push(pick);ww[pick]=0}return out}
function pickSet(id,{k,N,cnt,last,t},r){if(id==='random')return sampleK(N,k,r);
  const hot=[0],cold=[0];let cmax=0;for(let i=1;i<=N;i++)cmax=Math.max(cmax,cnt[i]);for(let i=1;i<=N;i++){hot[i]=(cnt[i]+0.5)**2;cold[i]=(cmax-cnt[i]+0.5)**2}
  const srt=a=>a.sort((x,y)=>x-y);
  if(id==='hot')return srt(weightedK(hot,k,r));if(id==='cold')return srt(weightedK(cold,k,r));
  if(id==='overdue'){const w=[0];for(let i=1;i<=N;i++)w[i]=((last[i]<0?t+1:t-last[i])+1)**1.5;return srt(weightedK(w,k,r))}
  const h=weightedK(hot,Math.ceil(k/2),r);return srt(h.concat(weightedK(cold,k-h.length,r,new Set(h))))}

/* ================= data helpers ================= */
function loadSample(){const r=mulberry32(4900+S.k*100+S.N);const end=Date.UTC(2026,9,24),n=520;S.draws=[];
  for(let i=0;i<n;i++){const d=new Date(end-(n-1-i)*3.5*864e5);S.draws.push({date:d.toISOString().slice(0,10),nums:sampleK(S.N,S.k,r)})}S.source='sample';btCache=null}
const drawKey=d=>d?(d.date||'')+'|'+d.nums.join('-'):'';
function ballCls(x){if(S.N===49)return HK_RED.includes(x)?'r':HK_BLUE.includes(x)?'b':'g';return['r','b','g'][Math.floor((x-1)/10)%3]}
const ball=(x,extra='')=>`<span class="ball ${ballCls(x)} ${extra}">${x}</span>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtP=p=>p<0.0001?'< 0.0001':p.toFixed(p<0.01?4:p<0.1?3:2);
const money=v=>`${S.cur} ${Number(v).toLocaleString(undefined,{maximumFractionDigits:2})}`;
function fmtDate(iso){if(!iso)return'';const d=new Date(iso+'T00:00:00Z');if(isNaN(d))return esc(iso);return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'})}
function oneIn(p){const v=1/p;return '1 in '+(v<10?v.toFixed(1):Math.round(v).toLocaleString())}

function stats(period){const{draws,k,N}=S;const n=draws.length;const from=Math.max(0,n-period);const sub=draws.slice(from);const m=sub.length;
  const cnt=new Array(N+1).fill(0),last=new Array(N+1).fill(-1);
  sub.forEach(d=>d.nums.forEach(x=>cnt[x]++));draws.forEach((d,t)=>d.nums.forEach(x=>last[x]=t));
  const p=k/N,E=m*p,sd=Math.sqrt(m*p*(1-p));let chi=0;for(let i=1;i<=N;i++)chi+=(cnt[i]-E)**2/(E||1);chi*=(N-1)/(N-k);
  const pval=m?1-gammaP((N-1)/2,chi/2):1;
  const rec=[];for(let i=1;i<=N;i++)rec.push({x:i,c:cnt[i],g:last[i]<0?n:n-1-last[i]});
  return{m,cnt,E,sd,pval,hot:[...rec].sort((a,b)=>b.c-a.c||a.x-b.x).slice(0,6),cold:[...rec].sort((a,b)=>a.c-b.c||a.x-b.x).slice(0,6),gap:[...rec].sort((a,b)=>b.g-a.g||a.x-b.x)[0]}}

let btCache=null;
function backtest(){const ck=[S.game,S.draws.length,drawKey(S.draws.at(-1)),S.win,S.warm].join();if(btCache&&btCache.ck===ck)return btCache;
  const{draws,k,N,win,warm}=S;const r=mulberry32(20261027);const cnt=new Array(N+1).fill(0),last=new Array(N+1).fill(-1);
  const mu=k*k/N,v=k*(k/N)*((N-k)/N)*((N-k)/(N-1));const res=STRATS.map(s=>({...s,total:0,n:0}));
  for(let t=0;t<draws.length;t++){if(t>=warm){const set=new Set(draws[t].nums);for(const s of res){const tk=pickSet(s.id,{k,N,cnt,last,t},r);let m=0;for(const x of tk)if(set.has(x))m++;s.total+=m;s.n++}}
    for(const x of draws[t].nums){cnt[x]++;last[x]=t}if(t-win>=0)for(const x of draws[t-win].nums)cnt[x]--}
  for(const s of res){s.mean=s.n?s.total/s.n:0;s.z=s.n?(s.total-s.n*mu)/Math.sqrt(s.n*v):0;s.p=pTwo(s.z)}
  btCache={ck,res,mu,T:res[0].n};return btCache}

/* pattern popularity: rule-based estimate of how commonly people choose a pattern (statistics only) */
function crowdScore(t){const{N}=S;const last=S.draws.at(-1);const f=[];let s=0;
  const b=t.filter(x=>x<=31).length;const bp=N>31?[0,0,0,10,25,45,65][Math.min(6,b+(6-t.length))]:0;s+=bp;
  f.push({ok:bp<10,title:'Date-range numbers (1–31)',sub:`${b} of ${t.length}${bp>=10?', a very commonly chosen range':', a spread-out mix'}`});
  let pairs=0,run=1,maxRun=1;for(let i=1;i<t.length;i++){if(t[i]===t[i-1]+1){pairs++;run++;maxRun=Math.max(maxRun,run)}else run=1}
  s+=pairs*10+(maxRun>=3?15:0);f.push({ok:pairs===0,title:pairs?`${pairs} consecutive pair${pairs>1?'s':''}`:'No runs like 21-22-23',sub:'Sequences are a commonly chosen pattern'});
  const d=t[1]-t[0];const even=t.every((x,i)=>i===0||x-t[i-1]===d);const mult=[5,7].some(m=>t.every(x=>x%m===0));if(even||mult)s+=30;
  f.push({ok:!(even||mult),title:even||mult?'Neat pattern':'No neat pattern',sub:'Even steps and multiples are commonly chosen'});
  const ov=last?t.filter(x=>last.nums.includes(x)).length:0;s+=ov*6;
  f.push({ok:ov===0,warn:ov>0&&ov<3,title:ov?`${ov} number${ov>1?'s':''} from the last result`:'Nothing from the last result',sub:'Repeating the last result is a common choice'});
  s=Math.min(100,s);const level=s<35?'Low':s<65?'Medium':'High';return{s,level,cls:s<35?'good':s<65?'mid':'bad',f}}
function lowerRisk(t){const{N,k}=S;if(N<=31)return t;const r=mulberry32((Date.now()^0x9e37)>>>0);let cur=t.slice();
  for(let tries=0;tries<200&&crowdScore(cur).s>=35;tries++){const last=S.draws.at(-1)?.nums||[];
    let idx=cur.findIndex((x,i)=>i>0&&x===cur[i-1]+1);if(idx<0)idx=cur.findIndex(x=>last.includes(x));if(idx<0)idx=cur.findIndex(x=>x<=31);if(idx<0)idx=Math.floor(r()*k);
    let n;do{n=32+Math.floor(r()*(N-31))}while(cur.includes(n));cur[idx]=n;cur.sort((a,b)=>a-b)}return cur}

/* saved number sets (statistical comparison only; never linked to money) */
function myGroups(){return S.groups.filter(g=>g.game===S.game)}
function resolve(g){const i=S.draws.findIndex(d=>drawKey(d)===g.after);if(g.after===''&&S.draws.length)return{state:'unknown'};if(i<0)return{state:'unknown'};const d=S.draws[i+1];return d?{state:'done',draw:d}:{state:'pending'}}
function myRecord(){let compared=0,low=0,hit=0;myGroups().forEach(g=>{const r=resolve(g);if(r.state!=='done')return;g.sets.forEach(t=>{compared++;const m=t.filter(x=>r.draw.nums.includes(x)).length;if(m>=3)hit++;else low++})});return{compared,low,hit}}
/* self-reported spending log: entries the user types in; independent of number sets */
const inMonth=(iso,now=new Date())=>{const c=new Date(iso);return c.getFullYear()===now.getFullYear()&&c.getMonth()===now.getMonth()};
function monthSpend(){return S.log.filter(e=>inMonth(e.date)).reduce((a,e)=>a+(Number(e.spent)||0),0)}
function yearTotals(){const y=new Date().getFullYear();let spent=0,won=0;S.log.forEach(e=>{if(new Date(e.date).getFullYear()===y){spent+=Number(e.spent)||0;won+=Number(e.won)||0}});return{spent,won}}

/* ================= screens ================= */
const ICON={back:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>',

function vHome(){const{k,N}=S;const last=S.draws.at(-1);const st=stats(S.draws.length);
  const p3=[...Array(k+1).keys()].filter(m=>m>=3).reduce((a,m)=>a+hyper(m,k,N),0);const per=Math.round(p3*1000);
  const pend=myGroups().filter(g=>resolve(g).state==='pending');const tks=pend.flatMap(g=>g.sets).slice(0,3);

  `<main>
  <section class="hero">${ICON.ring}

  </section>

    <a class="tile" href="#insights" style="text-decoration:none;color:inherit"><span class="k">Fairness</span><span class="v" style="color:${st.pval<0.01?'#ff8a90':'#4fd38c'}">${st.pval<0.01?'Check':'Fair'}</span><span class="s">p = ${fmtP(st.pval)}</span></a>
    <a class="tile" href="#outcomes" style="text-decoration:none;color:inherit"><span class="k">All ${k} match</span><span class="v">1 in ${jack>=1e6?(jack/1e6).toFixed(jack>=1e7?0:1)+'M':Math.round(jack).toLocaleString()}</span><span class="s">per combination</span></a>

    <a class="btn primary block" href="#sets"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Generate number sets</a>
  </section>
  <section class="note">${ICON.info}<div style="display:flex;flex-direction:column;gap:6px"><p>${1000-per} of every 1,000 possible combinations match 2 numbers or fewer. Every draw is random. If you play, set a budget.</p><a href="#outcomes" style="font-size:14px;font-weight:600;text-decoration:none">See odds &amp; outcomes</a></div></section>
  </main>`}

function vInsights(){const P=S.period>=S.draws.length?S.draws.length:S.period;const st=stats(P);const{N,k}=S;
  const ymax=Math.max(st.E+2.5*st.sd,...st.cnt.slice(1))||1;const y=v=>Math.max(0,v/ymax*100);
  const bars=st.cnt.slice(1).map((c,i)=>`<i class="${c>st.E+2*st.sd?'hi':c<st.E-2*st.sd?'lo':''}" style="height:${y(c)}%" title="${i+1}: ${c}"></i>`).join('');
  const outside=st.cnt.slice(1).filter(c=>Math.abs(c-st.E)>2*st.sd).length;
  const ticks=[1,10,20,30,40,N].filter((v,i,a)=>v<=N&&a.indexOf(v)===i);
  return topBar('Number insights',`${GAMES[S.game].name} · ${S.source==='sample'?'sample data':'your data'}`)+`<main>
  <div class="seg" role="group" aria-label="Period">${[[100,'Last 100'],[500,'Last 500'],[1e9,'All']].map(([v,l])=>`<button data-act="period" data-v="${v}" aria-pressed="${S.period===v}">${l}</button>`).join('')}</div>
  <section class="card">
    <div class="between"><h2>Times drawn, 1–${N}</h2><span class="mono" style="font-size:12px;color:var(--muted)">expected ${st.E.toFixed(1)}</span></div>

      <div class="band" style="bottom:${y(Math.max(0,st.E-2*st.sd))}%;height:${y(st.E+2*st.sd)-y(Math.max(0,st.E-2*st.sd))}%"></div>
      <div class="exp" style="bottom:${y(st.E)}%"></div>${bars}</div>
    <div class="axis">${ticks.map(t=>`<span>${t}</span>`).join('')}</div>
    <p class="sub">${outside?`${outside} number${outside>1?'s':''} outside the shaded normal range, about ${Math.max(1,Math.round(N*0.05))} is typical by chance.`:'All numbers sit inside the normal range (shaded).'} Fairness test p = ${fmtP(st.pval)} over ${st.m} draws.</p>
  </section>
  <section class="card">

    <div class="balls" style="gap:10px">${st.hot.map(o=>`<span class="chip">${ball(o.x,'md')}${o.c}×</span>`).join('')}</div>
    <h2 class="row"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8fb8ff" stroke-width="2" aria-hidden="true"><path d="M12 2v20M4 6l16 12M20 6L4 18"/></svg>Cold · drawn least</h2>
    <div class="balls" style="gap:10px">${st.cold.map(o=>`<span class="chip">${ball(o.x,'md')}${o.c}×</span>`).join('')}</div>
    <p class="sub">About ${st.E.toFixed(0)} each is expected in ${st.m} draws. Gaps this size happen by chance.</p>
  </section>
  <section class="card"><div class="t" style="display:flex;flex-direction:column;gap:4px"><span class="row" style="font-weight:600">Longest gap: ${ball(st.gap.x,'sm')}</span><span class="sub">Not drawn for ${st.gap.g} draws · average gap is ${(N/k).toFixed(0)}. It is no more likely to come next.</span></div></section>
  </main>`}

function vTest(){const bt=backtest();const{res,mu,T}=bt;const thr=0.05/(res.length-1);const beat=res.filter(r=>r.id!=='random'&&r.z>0&&r.p<thr);
  return topBar('Strategy test',`Each strategy picked one number set for ${T} past draws, using only earlier results.`)+`<main>
  <section class="hero" style="gap:6px">${ICON.ring}

    <p class="soft" style="margin:0;font-size:13.5px">${beat.length?'With fair draws this happens by luck now and then. Re-test with more draws.':'Every result sits inside the range luck alone produces.'}</p>
  </section>
  <section class="card flush" style="padding-bottom:10px">
    <div class="between" style="padding:10px 0 6px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600"><span>Strategy · avg matches</span><span>vs chance</span></div>
    <div class="list">${res.map(r=>{const left=60+Math.max(-3,Math.min(3,r.z))*20-6;return `<div class="item"><div class="t"><span style="font-weight:600">${r.name}</span><span class="mono s">${r.mean.toFixed(3)} · z ${r.z>0?'+':''}${r.z.toFixed(2)}</span></div><div class="track" role="img" aria-label="${r.name}: z-score ${r.z.toFixed(2)}"><div class="line"></div><div class="ok"></div><div class="mid"></div><div class="dot" style="left:${left}px;background:${r.color}"></div></div></div>`}).join('')}</div>
    <div class="row" style="justify-content:flex-end;gap:14px;font-size:11.5px;color:var(--muted)"><span class="row" style="gap:5px"><span style="width:12px;height:10px;border-radius:3px;background:#2a1517;border:1px solid var(--warn-line)"></span>normal luck</span><span class="row" style="gap:5px"><span style="width:2px;height:12px;background:var(--ink)"></span>chance ${mu.toFixed(3)}</span></div>
  </section>
  <section class="card"><h2>Settings</h2>
    <div class="grid2"><label class="field">Look-back window<input id="win" type="number" min="10" max="1000" value="${S.win}" data-chg="win"></label><label class="field">Warm-up draws<input id="warm" type="number" min="10" max="1000" value="${S.warm}" data-chg="warm"></label></div>
    <button class="btn outline block" data-act="rerun">Run test again</button></section>
  </main>`}

function genSets(){const{k,N,draws}=S;const g=S.gen;const r=mulberry32((Date.now()^(Math.random()*1e9))>>>0);
  const cnt=new Array(N+1).fill(0),last=new Array(N+1).fill(-1);const t=draws.length;draws.forEach((d,i)=>d.nums.forEach(x=>{last[x]=i;if(i>=t-S.win)cnt[x]++}));
  const out=[],seen=new Set();for(let i=0;i<g.count;i++){let tk,n=0;do{tk=pickSet(g.strategy,{k,N,cnt,last,t},r);n++}while(n<300&&((g.avoid&&crowdScore(tk).s>=35)||seen.has(tk.join())));seen.add(tk.join());out.push(tk)}g.sets=out;save()}

    <div class="between"><span style="font-weight:500">How many sets</span><div class="stepper"><button aria-label="Fewer sets" data-act="count" data-v="-1">−</button><span>${g.count}</span><button aria-label="More sets" data-act="count" data-v="1">+</button></div></div>

    <div class="row" style="padding:12px 0"><button class="btn" style="flex:1" data-act="copy">Copy</button><button class="btn outline" style="flex:1" data-act="saveSets">Save sets for comparison</button></div>

function vScore(){if(!S.gen.sets.length||S.gen.sets[0].length!==S.k)genSets();let t=S.scoreRef!=null?S.gen.sets[S.scoreRef]:null;if(!t){t=S.gen.sets[0]||sampleK(S.N,S.k,Math.random);S.scoreRef=0}

  </section>
  <section class="card flush"><div class="list">${c.f.map(f=>`<div class="item" style="justify-content:flex-start">${f.ok?ICON.ok:f.warn?ICON.warn:ICON.bad}<div class="t"><span>${f.title}</span><span class="s">${f.sub}</span></div></div>`).join('')}</div></section>
  <section class="note">${ICON.info}<p>This is a statistic about human number choices. It does not change any combination's chance of being drawn, and it is not a strategy for winning.</p></section>
  <div class="row"><a class="btn" style="flex:1" href="#sets">Keep set</a><button class="btn primary" style="flex:1" data-act="lower" ${c.s<35?'disabled':''}>Make less common</button></div>
  </main>`}

function vCompare(){const gs=myGroups().slice().reverse();const done=gs.map(g=>({g,r:resolve(g)}));
  const latest=done.find(x=>x.r.state==='done');let sum='';
  if(latest){const nums=latest.r.draw.nums;const ms=latest.g.sets.map(t=>t.filter(x=>nums.includes(x)).length);
    sum=`<section class="hero">${ICON.ring}<span class="eyebrow">Result · ${fmtDate(latest.r.draw.date)}</span><div class="balls">${nums.map(x=>ball(x,'ringed')).join('')}</div><div class="row wrap" style="gap:16px;font-size:13.5px"><span><b class="mono">${ms.length}</b> compared</span><span><b class="mono">${ms.filter(m=>m>=3).length}</b> matched 3+</span><span><b class="mono">${ms.filter(m=>m<3).length}</b> matched 2 or fewer</span></div></section>`}
  const body=done.length?done.map(({g,r})=>{const nums=r.state==='done'?r.draw.nums:null;
    return `<section class="card flush"><div class="between" style="padding:12px 0 4px"><span style="font-weight:600">${r.state==='done'?'Result '+fmtDate(r.draw.date):r.state==='pending'?'Waiting for a new result':'Result not in loaded history'}</span><span class="sub">${g.sets.length} set${g.sets.length>1?'s':''}</span></div>
    <div class="list">${g.sets.map((t,i)=>{const m=nums?t.filter(x=>nums.includes(x)).length:null;return `<div class="item" style="flex-direction:column;align-items:stretch;gap:8px"><div class="between"><span class="mono" style="font-size:12px;color:var(--muted)">Set ${i+1}</span>${m===null?'<span class="pill">Pending</span>':`<span class="pill ${m>=3?'good':''}">${m===0?'No match':'Matched '+m}</span>`}</div><div class="balls">${t.map(x=>ball(x,'md '+(nums?(nums.includes(x)?'hit':'miss'):''))).join('')}</div></div>`}).join('')}</div>
    <div style="padding:10px 0"><button class="btn" style="height:40px;font-size:13.5px" data-act="delGroup" data-v="${g.id}">Remove</button></div></section>`}).join(''):`<section class="card"><p class="sub">No saved number sets yet. On the Number sets screen tap "Save sets for comparison". They are compared automatically when you add a new result.</p><a class="btn primary" href="#sets">Go to number sets</a></section>`;
  return topBar('Result comparison','Saved number sets against each new result',{back:'sets'})+`<main>${sum}${body}
  <section class="card"><h2>Add a new result</h2><p class="sub">Enter the ${S.k} main numbers of a published result. Saved sets are compared straight away.</p>
    <div class="grid2"><label class="field">Result date<input id="resDate" type="date"></label><label class="field">Numbers<input id="resNums" type="text" inputmode="numeric" placeholder="3 11 19 27 38 45"></label></div>
    <button class="btn outline block" data-act="addResult">Add result</button>
    <p class="sub" style="font-size:12.5px">This is a statistical comparison only. Official results come from the lottery operator.</p></section>
  </main>`}

function vOutcomes(){const{k,N}=S;let p3=0;for(let m=3;m<=k;m++)p3+=hyper(m,k,N);const per=Math.round(p3*1000);const me=myRecord();
  const rows=[];for(let m=0;m<=k;m++)rows.push(`<div class="item"><span${m===k?' style="font-weight:600"':''}>${m===k?'All '+k+' numbers':'Exactly '+m+' number'+(m===1?'':'s')}</span><span class="mono" style="font-size:14px;color:${m===k?'var(--red-ink)':'var(--muted)'};font-weight:${m===k?600:400}">${oneIn(hyper(m,k,N))}</span></div>`);
  return topBar('Odds &amp; outcomes',`Probability for ${GAMES[S.game].name}, ${k} of ${N}`,{back:'home'})+`<main>
  <section class="hero" style="gap:12px"><span class="eyebrow">Out of every 1,000 possible combinations</span>
    <div class="row" style="gap:22px;align-items:baseline"><div style="display:flex;flex-direction:column"><span class="big">${1000-per}</span><span class="soft" style="font-size:13px">match 2 or fewer</span></div><div style="display:flex;flex-direction:column"><span class="big">${per}</span><span class="soft" style="font-size:13px">match 3 or more</span></div></div>
    <div class="split" role="img" aria-label="${1000-per} of 1,000 match 2 or fewer; ${per} match 3 or more"><div style="width:${100-per/10}%;background:#2a0508"></div><div style="width:${per/10}%;min-width:6px;background:#fff"></div></div></section>
  <section class="card flush"><div class="between" style="padding:10px 0 4px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600"><span>Numbers matched</span><span>Chance</span></div><div class="list">${rows.join('')}</div></section>
  <section class="card"><h2>Your saved sets</h2>
    ${me.compared?`<div class="tiles"><div class="tile"><span class="k">Compared</span><span class="v">${me.compared}</span></div><div class="tile"><span class="k">2 or fewer</span><span class="v" style="color:#ff8a90">${me.low}</span></div><div class="tile"><span class="k">3 or more</span><span class="v" style="color:#4fd38c">${me.hit}</span></div></div>
    <p class="sub">Your results so far against the expected ${1000-per} in 1,000.</p>`:'<p class="sub">Save number sets and add results to compare them here. It stays on this phone.</p>'}
  </section></main>`}

function vBudget(){const sp=monthSpend();const pct=S.limit>0?Math.min(100,sp/S.limit*100):0;const yt=yearTotals();const net=yt.won-yt.spent;
  const now=new Date();const reset=new Date(now.getFullYear(),now.getMonth()+1,1).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  const entries=S.log.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,12);
  return topBar('Spending log','A private record of what you spend on lotteries elsewhere',{back:'home'})+`<main>
  <section class="hero">${ICON.ring}<div class="between"><span class="eyebrow">${now.toLocaleDateString('en-GB',{month:'long'})} limit</span><span class="mono soft" style="font-size:13px">${money(S.limit)}</span></div>
    <div class="row" style="align-items:baseline;gap:8px"><span class="big" style="font-size:34px">${money(sp)}</span><span class="soft">spent</span></div>
    <div class="progress" role="img" aria-label="${Math.round(pct)} percent of the monthly limit used"><div style="width:${pct}%;${pct>=100?'background:#ffd6d8':''}"></div></div>
    <span style="font-size:13.5px">${S.limit>0&&sp>=S.limit?'Limit reached. Consider taking a break.':money(Math.max(0,S.limit-sp))+' left'} · resets ${reset}</span></section>
  <section class="tiles"><div class="tile"><span class="k">Spent ${now.getFullYear()}</span><span class="v">${yt.spent.toLocaleString()}</span></div><div class="tile"><span class="k">Returned</span><span class="v">${yt.won.toLocaleString()}</span></div><div class="tile"><span class="k">Net</span><span class="v" style="color:${net<0?'#ff8a90':'#4fd38c'}">${net<0?'−':''}${Math.abs(net).toLocaleString()}</span></div></section>
  <section class="card"><h2>Add an entry</h2>
    <div class="grid2"><label class="field">Date<input id="logDate" type="date"></label><label class="field">Spent (${esc(S.cur)})<input id="logSpent" type="number" min="0" step="any" inputmode="decimal" placeholder="0"></label></div>
    <label class="field">Returned to you (${esc(S.cur)}, optional)<input id="logWon" type="number" min="0" step="any" inputmode="decimal" placeholder="0"></label>
    <button class="btn outline block" data-act="addLog">Add entry</button>
    <p class="sub" style="font-size:12.5px">The app never buys, sells or pays anything. This log only holds figures you type in.</p></section>
  <section class="card flush"><div class="list">${entries.length?entries.map(e=>`<div class="item"><div class="t"><span>${fmtDate(e.date)}</span></div><span class="mono">−${(Number(e.spent)||0).toLocaleString()}${Number(e.won)?` <span style="color:#4fd38c">+${Number(e.won).toLocaleString()}</span>`:''} <button class="icon-btn" style="width:32px;height:32px;border-radius:16px;margin-left:6px" aria-label="Delete entry" data-act="delLog" data-v="${e.id}">×</button></span></div>`).join(''):'<div class="item"><span class="sub">Entries you add appear here.</span></div>'}</div></section>
  <section class="card"><h2>Settings</h2>
    <div class="grid2"><label class="field">Monthly limit<input id="limit" type="number" min="0" step="any" value="${S.limit}" data-chg="limit"></label><label class="field">Currency<input id="cur" type="text" maxlength="4" value="${esc(S.cur)}" data-chg="cur"></label></div>
    <label class="between" style="gap:12px"><span>Warn me at 80% of my limit</span><input id="remind" type="checkbox" ${S.remind?'checked':''} data-chg="remind"></label>
  </section>
  <section class="note">${ICON.info}<p>Lotteries are designed so that players lose money on average. Only spend what you can afford to lose.</p></section>
  </main>`}

function vData(){const last=S.draws.slice(-15).reverse();return topBar('Draw history',`${S.draws.length} draws · ${S.source==='sample'?'simulated sample':'your data'}`,{back:'home'})+`<main>
  <section class="card"><h2>Import real results</h2><p class="sub">Paste rows or load a CSV. Each row: a date (optional) and the main numbers, like <span class="mono">2026-10-24, 3, 11, 19, 27, 38, 45</span>. The first ${S.k} distinct numbers from 1 to ${S.N} are used; bonus balls are ignored.</p>
    <textarea id="paste" aria-label="Draw rows" placeholder="2026-10-21, 5, 12, 18, 30, 41, 47"></textarea>
    <input id="file" type="file" accept=".csv,.txt,text/csv,text/plain" aria-label="Choose CSV file" data-chg="file">
    <label class="between"><span>Newest draw is listed first</span><input id="newest" type="checkbox"></label>
    <div class="row"><button class="btn primary" style="flex:1" data-act="import">Import draws</button><button class="btn" style="flex:1" data-act="sample">Use sample</button></div></section>
  <section class="card"><h2>Latest loaded draws</h2><div class="tablebox"><table><tr><th>Date</th><th>Numbers</th></tr>${last.map(d=>`<tr><td>${esc(d.date||'—')}</td><td class="mono">${d.nums.join(' · ')}</td></tr>`).join('')}</table></div></section>
  </main>`}

/* ================= router ================= */
const VIEWS={home:vHome,insights:vInsights,test:vTest,sets:vSets,score:vScore,compare:vCompare,outcomes:vOutcomes,budget:vBudget,data:vData};
const PARENT={score:'sets',compare:'sets',outcomes:'home',budget:'home',data:'home'};
/* routes renamed in v1; the syndicate screen was removed */
const LEGACY={tickets:'sets',checker:'compare',syndicate:'home'};
let current='home';
function render(keepScroll){let h=location.hash.slice(1);if(LEGACY[h]){history.replaceState(null,'','#'+LEGACY[h]);h=LEGACY[h]}current=VIEWS[h]?h:'home';const y=window.scrollY;
  $('#screen').innerHTML=VIEWS[current]();const tab=PARENT[current]||current;
  document.querySelectorAll('#tabs a').forEach(a=>a.setAttribute('aria-current',a.dataset.tab===tab?'page':'false'));
  window.scrollTo(0,keepScroll?y:0)}
window.addEventListener('hashchange',()=>render(false));

let toastT;function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3200)}
function copyText(txt,okMsg){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>toast(okMsg)).catch(()=>toast('Copy blocked: select the text manually.'))}else toast('Copy not supported on this device.')}
function parseRows(text,newestFirst){const out=[];let skipped=0;const DATE=/(\d{4}[-/.]\d{1,2}[-/.]\d{1,2}|\d{1,2}[-/.]\d{1,2}[-/.]\d{2,4})/;
  for(const raw of text.split(/\r?\n/)){const line=raw.trim();if(!line)continue;const dm=line.match(DATE);let date=dm?dm[1]:'';
    if(date&&!/^\d{4}/.test(date)){const p=date.split(/[-/.]/);let yy=p[2].length===2?'20'+p[2]:p[2];date=`${yy}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`}else if(date)date=date.replace(/[/.]/g,'-').replace(/-(\d)(?=-|$)/g,'-0$1');
    const rest=dm?line.replace(dm[1],' '):line;const nums=[];for(const m of rest.matchAll(/\d+/g)){const v=+m[0];if(v>=1&&v<=S.N&&!nums.includes(v))nums.push(v);if(nums.length===S.k)break}
    if(nums.length===S.k)out.push({date,nums:nums.sort((a,b)=>a-b)});else skipped++}
  if(newestFirst)out.reverse();return{out,skipped}}

/* ================= actions ================= */
const ACT={
  period:el=>{S.period=+el.dataset.v;save();render(true)},
  rerun:()=>{btCache=null;render(true);toast('Test re-run.')},
  strat:el=>{S.gen.strategy=el.dataset.v;genSets();render(true)},
  count:el=>{S.gen.count=Math.max(1,Math.min(10,S.gen.count+ +el.dataset.v));genSets();render(true)},
  generate:()=>{genSets();render(true)},
  score:(el,e)=>{e.preventDefault();S.scoreRef=+el.dataset.v;location.hash='score'},
  lower:()=>{const i=S.scoreRef??0;S.gen.sets[i]=lowerRisk(S.gen.sets[i]);save();render(true);toast('Set updated.')},
  copy:()=>copyText(S.gen.sets.map(t=>t.join(' ')).join('\n'),'Number sets copied.'),
  saveSets:()=>{S.groups.push({id:Date.now().toString(36),game:S.game,after:drawKey(S.draws.at(-1)),sets:S.gen.sets.map(t=>t.slice()),created:new Date().toISOString()});save();
    toast('Saved. They will be compared when you add a new result.')},
  delGroup:el=>{S.groups=S.groups.filter(g=>g.id!==el.dataset.v);save();render(true)},
  addResult:()=>{const nums=[...new Set((($('#resNums').value||'').match(/\d+/g)||[]).map(Number).filter(v=>v>=1&&v<=S.N))];
    if(nums.length!==S.k){toast(`Enter exactly ${S.k} different numbers from 1 to ${S.N}.`);return}
    const date=$('#resDate').value||new Date().toISOString().slice(0,10);S.draws.push({date,nums:nums.sort((a,b)=>a-b)});if(S.source==='sample')S.source='mixed';btCache=null;save();render(false);toast('Result added and saved sets compared.')},
  import:()=>{const{out,skipped}=parseRows($('#paste').value,$('#newest').checked);if(out.length<20){toast(`Found ${out.length} valid draws. Add at least 20 rows with ${S.k} numbers each.`);return}
    S.draws=out;S.source='import';btCache=null;save();render(false);toast(`Imported ${out.length} draws${skipped?`, skipped ${skipped} rows`:''}.`)},
  sample:()=>{loadSample();save();render(false);toast('Loaded the simulated sample.')},
  addLog:()=>{const spent=Math.max(0,+$('#logSpent').value||0),won=Math.max(0,+$('#logWon').value||0);
    if(!spent&&!won){toast('Enter an amount spent or returned.');return}
    const date=$('#logDate').value||new Date().toISOString().slice(0,10);const before=monthSpend();
    S.log.push({id:Date.now().toString(36),date,spent,won});save();render(true);const after=monthSpend();
    toast(S.remind&&S.limit>0&&inMonth(date)&&after>=0.8*S.limit&&before<S.limit?`Entry added. You have used ${Math.round(after/S.limit*100)}% of this month's limit.`:'Entry added.')},
  delLog:el=>{S.log=S.log.filter(e=>e.id!==el.dataset.v);save();render(true)}
};
const CHG={
  game:el=>{S.game=el.value;const g=GAMES[S.game];S.k=g.k;S.N=g.N;S.cur=g.cur;S.gen.sets=[];loadSample();save();render(false);toast(`Switched to ${g.name}. Import its real results in Draw history.`)},
  win:el=>{S.win=Math.max(10,+el.value||100)},warm:el=>{S.warm=Math.max(10,+el.value||50)},
  avoid:el=>{S.gen.avoid=el.checked;genSets();render(true)},
  limit:el=>{S.limit=Math.max(0,+el.value||0);save();render(true)},
  cur:el=>{S.cur=el.value.trim()||'$';save();render(true)},remind:el=>{S.remind=el.checked;save()},
  file:el=>{const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#paste').value=r.result;toast('File loaded. Tap Import draws.')};r.readAsText(f)}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el&&ACT[el.dataset.act])ACT[el.dataset.act](el,e)});
document.addEventListener('change',e=>{const el=e.target.closest('[data-chg]');if(el&&CHG[el.dataset.chg])CHG[el.dataset.chg](el,e)});

/* ================= start ================= */
load();if(!S.draws.length)loadSample();render(false);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
